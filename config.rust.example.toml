[database]
# Prefer ARTEX_PG_DSN or a private config file. Use a dedicated SELECT-only
# PostgreSQL role. Remote connections require sslmode=verify-full.
dsn = ""
max_connections = 4

[local]
# Defaults to $XDG_RUNTIME_DIR/arustex-inspect.sock. An explicit socket must
# be inside a directory owned by the current user and inaccessible to others.
# socket = "/path/to/private-runtime/arustex-inspect.sock"
