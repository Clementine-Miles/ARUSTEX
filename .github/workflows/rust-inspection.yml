name: Linux Rust inspection

on:
  push:
    branches: [main, rust]
  pull_request:
    branches: [main, rust]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt
      - name: Verify the Rust workspace
        run: |
          rustc --version
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --workspace
          cargo build --locked --workspace
      - name: Verify PostgreSQL compatibility
        run: |
          if ! command -v pg_config >/dev/null || [[ ! -x "$(pg_config --bindir)/initdb" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
          fi
          export PATH="$(pg_config --bindir):$PATH"
          fixture_dir=$(mktemp -d "$RUNNER_TEMP/arustex-postgres.XXXXXX")
          pg_data="$fixture_dir/data"
          trap 'if [[ -f "$pg_data/postmaster.pid" ]]; then pg_ctl -w -D "$pg_data" stop -m fast; fi' EXIT
          initdb -D "$pg_data" -A trust -U fixture_admin --no-locale --encoding=UTF8
          pg_ctl -w -D "$pg_data" -l "$fixture_dir/postgres.log" -o "-h 127.0.0.1 -p 55432 -k '$fixture_dir'" start
          createdb -h 127.0.0.1 -p 55432 -U fixture_admin fixture
          admin_dsn='postgres://fixture_admin@127.0.0.1:55432/fixture?sslmode=disable'
          psql "$admin_dsn" -q -v ON_ERROR_STOP=1 -f db/schema.sql
          psql "$admin_dsn" -q -v ON_ERROR_STOP=1 -f crates/arustex-store/tests/legacy_fixture.sql
          ARUSTEX_TEST_DATABASE_URL='postgres://arustex_fixture_observer@127.0.0.1:55432/fixture?sslmode=disable' \
            cargo test --locked -p arustex-store --test legacy_read -- --ignored
