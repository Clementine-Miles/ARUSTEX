[workspace]
members = ["apps/arustex", "crates/arustex-app", "crates/arustex-core", "crates/arustex-store", "crates/arustex-tui"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
arustex-app = { path = "crates/arustex-app" }
arustex-core = { path = "crates/arustex-core" }
arustex-store = { path = "crates/arustex-store" }
arustex-tui = { path = "crates/arustex-tui" }
clap = { version = "4.6.10", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.32"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring-webpki"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
toml = "0.8.23"
url = "2.5.8"
